[platformio]
default_envs = cyd_2432s028

[env:cyd_2432s028]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_4MB.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
