name: Build CYD Headless

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e cyd_2432s028

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cyd-headless-firmware
          path: |
            .pio/build/cyd_2432s028/firmware.bin
            .pio/build/cyd_2432s028/bootloader.bin
            .pio/build/cyd_2432s028/partitions.bin
